aid: aegle-therapeutics
name: Aegle Therapeutics
description: 'Aegle Therapeutics Corporation is a privately held, clinical-stage regenerative
  medicine company developing extracellular vesicle (EV) therapy — a cell-free therapeutic
  composite of EVs, including exosomes, isolated from allogeneic bone marrow-derived
  mesenchymal stem cells using its proprietary EV harvesting technology. Its lead candidate,
  AGLE-102, is in a Phase 1/2 clinical study for Recessive Dystrophic Epidermolysis Bullosa
  (RDEB) and other severe dermatological disorders with significant unmet medical need.
  The company publishes a seven-page WordPress marketing site and no developer program,
  API, SDK or machine-readable specification of any kind.'
