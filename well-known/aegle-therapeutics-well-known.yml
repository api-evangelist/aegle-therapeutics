# Not a /.well-known/ document, kept out of hosts[].documents[] deliberately so it is
# never mistaken for a well-known catalog hit. Recorded because it is a REAL, served,
# provider-published AI-consent surface (the consent_identity dimension).
content_signals:
  path: /robots.txt
  url: https://aegletherapeutics.com/robots.txt
  status: 200
  file: aegle-therapeutics-robots.txt
  method: probed
  provider: cloudflare-managed-content-signals
  signals:
    search: 'yes'
    ai-train: 'no'
    use: reference
    ai-input: unset
  eu_dsm_reservation: true
  blocked_agents:
  - Amazonbot
  - Applebot-Extended
  - Bytespider
  - CCBot
  - ClaudeBot
  - CloudflareBrowserRenderingCrawler
  - GPTBot
  - Google-Extended
  - meta-externalagent
  note: >-
    Aegle serves Cloudflare's managed Content-Signal block plus a Yoast block. Content is
    allowed for search indexing and for AI reference use, but ai-train=no, and nine named
    AI crawlers are fully disallowed. The general User-agent:* rule allows crawling, which
    is what this pass used; no AI-crawler user agent was impersonated.
